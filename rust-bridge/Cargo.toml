[package]
name = "jpyrust"
version = "2.2.0"
edition = "2021"

[lib]
name = "jpyrust"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21.1"
shared_memory = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_SystemServices",
] }
