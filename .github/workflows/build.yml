name: Build Rust Bridge

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib: libjpyrust.so
            out: jpyrust.so
            test: true
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            lib: libjpyrust.so
            out: jpyrust.so
            test: true
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            lib: jpyrust.dll
            out: jpyrust.dll
            test: true
          - platform: darwin-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            lib: libjpyrust.dylib
            out: jpyrust.dylib
            test: true
          - platform: darwin-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            lib: libjpyrust.dylib
            out: jpyrust.dylib
            test: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
        components: clippy

    - name: Build
      working-directory: ./rust-bridge
      shell: bash
      run: cargo build --release --target ${{ matrix.target }}

    - name: Clippy
      if: runner.os != 'Windows'
      working-directory: ./rust-bridge
      shell: bash
      run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings

    - name: Test
      if: matrix.test
      working-directory: ./rust-bridge
      shell: bash
      run: cargo test --target ${{ matrix.target }}

    - name: Stage native
      shell: bash
      run: |
        mkdir -p dist/${{ matrix.platform }}
        cp rust-bridge/target/${{ matrix.target }}/release/${{ matrix.lib }} dist/${{ matrix.platform }}/${{ matrix.out }}

    - name: Upload native
      uses: actions/upload-artifact@v4
      with:
        name: native-${{ matrix.platform }}
        path: dist/

  java-test:
    name: Java tests (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
    - uses: actions/checkout@v4

    - name: Use natives built by this run
      uses: actions/download-artifact@v4
      with:
        pattern: native-*
        merge-multiple: true
        path: java-api/src/main/resources/natives

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Test java-api with a real Python worker and compile demo-web
      shell: bash
      env:
        JPYRUST_PROVISION_TEST: "true"
      run: ./gradlew :java-api:test :spring-boot-starter:test :demo-web:compileJava :examples:quickstart:compileJava :examples:spring-boot:compileJava :benchmarks:jmhClasses --console=plain

  windows-provision:
    name: Windows Python provisioning
    needs: build
    runs-on: windows-latest
    env:
      JPYRUST_PROVISION_TEST: "true"
      JPYRUST_FULL_STACK_TEST: "true"
    steps:
    - uses: actions/checkout@v4

    - name: Use natives built by this run
      uses: actions/download-artifact@v4
      with:
        pattern: native-*
        merge-multiple: true
        path: java-api/src/main/resources/natives

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python for the custom interpreter test
      id: py
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Provision embedded Python on first initialize
      shell: bash
      env:
        JPYRUST_TEST_PYTHON: ${{ steps.py.outputs.python-path }}
      run: ./gradlew :java-api:test --tests com.jpyrust.PythonProvisioningTest --tests com.jpyrust.WorkerBehaviorTest --console=plain

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-provision-report
        path: java-api/build/reports/tests/

  python-test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install test dependencies
      run: pip install numpy opencv-python-headless pytest

    - name: Run pytest
      run: pytest python-core/tests -q

  package:
    name: Package JAR
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use natives built by this run
      uses: actions/download-artifact@v4
      with:
        pattern: native-*
        merge-multiple: true
        path: java-api/src/main/resources/natives

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Check Cargo and Gradle versions match
      shell: bash
      run: |
        gradle_version=$(grep '^version=' gradle.properties | cut -d= -f2)
        cargo_version=$(grep -m1 '^version = ' rust-bridge/Cargo.toml | cut -d'"' -f2)
        [[ "$gradle_version" == "$cargo_version" ]] || { echo "gradle.properties $gradle_version != Cargo.toml $cargo_version"; exit 1; }

    - name: Resolve version
      id: version
      shell: bash
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        else
          echo "value=$(grep '^version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
        fi

    - name: Build JAR
      run: ./gradlew :java-api:jar -Pversion=${{ steps.version.outputs.value }} --console=plain

    - name: Verify bundled natives
      shell: bash
      run: |
        jar=java-api/build/libs/java-api-${{ steps.version.outputs.value }}.jar
        unzip -l "$jar" | grep 'natives/'
        for f in linux-x86_64/jpyrust.so linux-aarch64/jpyrust.so windows-x86_64/jpyrust.dll darwin-aarch64/jpyrust.dylib darwin-x86_64/jpyrust.dylib; do
          unzip -l "$jar" | grep -q "natives/$f" || { echo "missing natives/$f"; exit 1; }
        done
        mkdir -p dist && cp "$jar" "dist/jpyrust-${{ steps.version.outputs.value }}.jar"

    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: jar
        path: dist/

  release:
    name: Create Release
    needs: [package, java-test, windows-provision, python-test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}

    steps:
    - name: Download JAR and natives
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Collect release files
      shell: bash
      run: |
        mkdir -p release
        cp artifacts/jar/*.jar release/
        for dir in artifacts/native-*; do
          platform=${dir#artifacts/native-}
          for f in "$dir/$platform"/*; do
            cp "$f" "release/${platform}-$(basename "$f")"
          done
        done
        ls -l release

    - uses: actions/checkout@v4
      if: env.MAVEN_CENTRAL_USERNAME != ''
      with:
        path: source

    - name: Set up Java
      if: env.MAVEN_CENTRAL_USERNAME != ''
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Publish to Maven Central
      if: env.MAVEN_CENTRAL_USERNAME != ''
      shell: bash
      working-directory: source
      env:
        MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      run: |
        for dir in ../artifacts/native-*; do cp -r "$dir"/* java-api/src/main/resources/natives/; done
        ./gradlew :java-api:publishAllPublicationsToCentralStagingRepository :spring-boot-starter:publishAllPublicationsToCentralStagingRepository -Pversion=${GITHUB_REF_NAME#v} --console=plain
        (cd build/central-staging && zip -qr ../central-bundle.zip io -x '*maven-metadata*')
        token=$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)
        curl --fail-with-body -X POST "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=jpyrust-${GITHUB_REF_NAME}" \
          -H "Authorization: Bearer $token" -F bundle=@build/central-bundle.zip

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: release/*
        generate_release_notes: true
