name: Feature request
description: Suggest a new capability or API change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behavior you have in mind. A Java snippet of how you would call it helps.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
